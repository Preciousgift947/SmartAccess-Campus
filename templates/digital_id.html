<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAccess | My QR Code</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        #qr-box {
            width: min(80vw, 360px);
            height: min(80vw, 360px);
            background: #ffffff;
            border: 1px solid #d8e0ec;
            border-radius: 14px;
            padding: 14px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b3f82;
        }

        #qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logout {
            margin-top: 22px;
            color: #0b3f82;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body data-page="digital-id" data-role="student">

    <div id="qr-box"><span>Loading QR code...</span></div>

    <a class="logout" href="/logout">Log out</a>

    <script src="{{ url_for('static', filename='digital_id.js') }}"></script>

</body>
</html>
