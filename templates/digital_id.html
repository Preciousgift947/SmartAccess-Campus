<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAccess | My QR Code</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }

        .id-card {
            width: min(100%, 400px);
            border-radius: 18px;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #e4e8ef;
            box-shadow: 0 8px 25px rgba(17, 32, 56, 0.08);
            text-align: center;
        }

        .id-header {
            background: linear-gradient(135deg, #062b63, #0b5ed7);
            color: #ffffff;
            padding: 22px;
        }

        .id-header strong {
            display: block;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .id-header p {
            margin: 8px 0 0;
            font-size: 12px;
            opacity: 0.85;
        }

        .id-body {
            padding: 24px;
        }

        #qr-box {
            width: min(70vw, 300px);
            height: min(70vw, 300px);
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #d8e0ec;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b3f82;
        }

        #qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .id-hint {
            margin: 18px 0 0;
            font-size: 13px;
            color: #6b7280;
        }

        .logout {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 22px;
            border-radius: 8px;
            background: #eaf1ff;
            color: #062b63;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body data-page="digital-id" data-role="student">

    <div class="id-card">
        <div class="id-header">
            <strong>RICHFIELD GRADUATE INSTITUTE OF TECHNOLOGY</strong>
            <p>SMARTACCESS DIGITAL STUDENT ID</p>
        </div>

        <div class="id-body">
            <div id="qr-box"><span>Loading QR code...</span></div>
            <p class="id-hint">Show this QR code at the gate.</p>
            <a class="logout" href="/logout">Log out</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='digital_id.js') }}"></script>

</body>
</html>
